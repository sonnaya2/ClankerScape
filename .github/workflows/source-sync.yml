name: Sync Equilibrium tasks

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-equilibrium-tasks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch canonical task rows
        run: npm run sync:tasks
      - name: Verify imported data
        run: npm run verify
      - name: Commit source revision when changed
        run: |
          if git diff --quiet -- data/equilibrium-tasks.snapshot.json; then
            echo "Task snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/equilibrium-tasks.snapshot.json
          git commit -m "Refresh Equilibrium tasks"
          git push
