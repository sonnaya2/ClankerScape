name: Apply audited ClankerScape tree

on:
  push:
    branches:
      - planning/dragon-route-foundation
    paths:
      - .github/workflows/apply-audited-tree.yml
      - .bootstrap/**

permissions:
  contents: write

concurrency:
  group: apply-audited-clankerscape-tree
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning/dragon-route-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and extract audited payload
        run: |
          cat .bootstrap/clankerscape.part-*.b64 | base64 --decode > /tmp/clankerscape.tar.gz
          echo "15621d77f0620513cb499234a7e1e9b0e018a23893eec6a5fe16118a077f893c  /tmp/clankerscape.tar.gz" | sha256sum --check
          if tar -tzf /tmp/clankerscape.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path" >&2
            exit 1
          fi
          tar -xzf /tmp/clankerscape.tar.gz -C .
          rm -rf .bootstrap .github/workflows/apply-audited-tree.yml
      - name: Check current canonical task source
        continue-on-error: true
        run: node scripts/sync-equilibrium-tasks.mjs
      - name: Verify application
        run: npm run verify
      - name: Commit audited application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build source-locked Dragon route workbench"
          git push
