<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#071014">
  <meta name="description" content="ClankerScape is a RuneScape 3 Equilibrium League route planner for reaching Dragon.">
  <title>ClankerScape — Dragon route</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./community-palette.css">
</head>
<body>
  <header id="topbar-state" class="topbar" aria-label="ClankerScape navigation and progress">
    <div class="loading-line">Loading League data…</div>
  </header>

  <main id="app" class="app-shell" tabindex="-1">
    <p class="loading-state">Loading tasks…</p>
  </main>

  <input id="import-progress" type="file" accept="application/json,.json" hidden>

  <dialog id="task-dialog" class="task-dialog" aria-labelledby="task-dialog-title">
    <div class="dialog-shell">
      <div class="dialog-toolbar">
        <span>Task details</span>
        <button type="button" class="icon-button" data-dialog-close aria-label="Close task details">×</button>
      </div>
      <div id="task-dialog-body" class="dialog-body"></div>
    </div>
  </dialog>

  <noscript>
    <div class="noscript">JavaScript is required to track progress and plan tasks.</div>
  </noscript>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
